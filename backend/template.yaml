AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Contact Form API - Node.js 24 Lambda with REST API

Globals:
  Function:
    Runtime: nodejs24.x
    Handler: src/index.handler
    Timeout: 10
    MemorySize: 128
    Environment:
      Variables:
        SENDER_EMAIL: !Ref SenderEmail
        RECIPIENT_EMAIL: !Ref RecipientEmail
    Tracing: Active
    LoggingConfig:
      LogFormat: JSON
      ApplicationLogLevel: INFO
      SystemLogLevel: INFO

Parameters:
  SenderEmail:
    Type: String
    Description: Verified SES sender email address
    Default: yashikaagrawal1926@gmail.com
  RecipientEmail:
    Type: String
    Description: Verified recipient email address
    Default: yashikaagrawal1926@gmail.com

Resources:
  ContactApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
      Cors:
        AllowOrigin: "'*'"
        AllowMethods: "'POST,OPTIONS'"
        AllowHeaders: "'Content-Type'"
      DefinitionBody:
        swagger: '2.0'
        info:
          title: ContactFormAPI
        paths:
          /contact:
            post:
              x-amazon-apigateway-integration:
                httpMethod: POST
                type: aws_proxy
                uri:
                  Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ContactFunction.Arn}/invocations
                responses: {}
              responses:
                '200':
                  description: Success
                '400':
                  description: Bad Request
                '500':
                  description: Internal Server Error

  GatewayResponseDefault4XX:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      RestApiId: !Ref ContactApi
      ResponseType: DEFAULT_4XX
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: "'*'"

  GatewayResponseDefault5XX:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      RestApiId: !Ref ContactApi
      ResponseType: DEFAULT_5XX
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: "'*'"

  ContactFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ContactFunctionPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ses:SendEmail
                  - ses:SendRawEmail
                Resource: !Sub arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:identity/${SenderEmail}
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/contact-form-api:*

  ContactFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: contact-form-api
      CodeUri: .
      Role: !GetAtt ContactFunctionRole.Arn
      Events:
        PostContact:
          Type: Api
          Properties:
            RestApiId: !Ref ContactApi
            Path: /contact
            Method: POST

Outputs:
  ContactApiUrl:
    Description: Invoke URL for the contact API
    Value: !Sub https://${ContactApi}.execute-api.${AWS::Region}.amazonaws.com/prod/contact
    Export:
      Name: ContactApiUrl
