<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- 16x16 pixel art coin scaled to 32x32 -->
  <!-- Background circle -->
  <circle cx="16" cy="16" r="14" fill="#FFD700" stroke="#B8860B" stroke-width="2"/>
  <!-- Inner highlight -->
  <circle cx="16" cy="16" r="10" fill="#FFEC8B" stroke="none"/>
  <!-- Coin symbol: $ -->
  <path d="M16 6 L16 26" stroke="#B8860B" stroke-width="2" stroke-linecap="round"/>
  <path d="M8 16 L24 16" stroke="#B8860B" stroke-width="2" stroke-linecap="round"/>
  <!-- Small pixel details -->
  <rect x="12" y="12" width="2" height="2" fill="#B8860B"/>
  <rect x="18" y="12" width="2" height="2" fill="#B8860B"/>
  <rect x="12" y="18" width="2" height="2" fill="#B8860B"/>
  <rect x="18" y="18" width="2" height="2" fill="#B8860B"/>
</svg>